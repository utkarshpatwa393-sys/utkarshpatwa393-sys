<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 210" role="img" aria-label="Portfolio: My personal portfolio site, deployed on Vercel, with projects and profile links."><title>Portfolio: My personal portfolio site, deployed on Vercel, with projects and profile links.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
