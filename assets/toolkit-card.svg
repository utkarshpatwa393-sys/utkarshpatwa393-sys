<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Toolkit: HTML, CSS, JavaScript, data structures and algorithms, Git, GitHub, VS Code and Vercel"><title>Toolkit: HTML, CSS, JavaScript, data structures and algorithms, Git, GitHub, VS Code and Vercel</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{r:5;opacity:.9}50%{r:8;opacity:.35}}
@keyframes dash{to{stroke-dashoffset:-60}}@keyframes float{50%{transform:translateY(-6px)}}
