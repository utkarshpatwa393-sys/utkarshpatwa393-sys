<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 210" role="img" aria-label="Jio Clone: Repository initialized for a Jio clone project, with initial README setup."><title>Jio Clone: Repository initialized for a Jio clone project, with initial README setup.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
