<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 210" role="img" aria-label="Weather: Repository reserved on GitHub for a weather project; no commits published yet."><title>Weather: Repository reserved on GitHub for a weather project; no commits published yet.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{animation:in .8s cubic-bezier(.16,1,.3,1)}
