<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 210" role="img" aria-label="Phone Seller Site: An Android phone seller website with product listings and a clean storefront layout."><title>Phone Seller Site: An Android phone seller website with product listings and a clean storefront layout.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{r:5;opacity:.9}50%{r:8;opacity:.35}}
@keyframes dash{to{stroke-dashoffset:-60}}@keyframes float{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><rect x="2" y="2" width="586" height="206" rx="16" fill="#111A18" stroke="#FF8A65" stroke-opacity=".5"/><rect x="2" y="2" width="6" height="206" rx="3" fill="#FF8A65"/><text class="m" x="32" y="40" fill="#FF8A65" font-size="12" letter-spacing="3">PROJECT / 02</text><text class="s" x="30" y="84" fill="#E8F1EE" font-size="30" font-weight="800">Phone Seller Site</text><text class="s" x="32" y="114" fill="#7C918B" font-size="15">An Android phone seller website with product listings and</text><text class="s" x="32" y="136" fill="#7C918B" font-size="15">a clean storefront layout.</text><rect x="32" y="160" width="57" height="28" rx="14" fill="#0A100F" stroke="#FF8A65" stroke-opacity=".6"/><text class="m" x="60" y="179" text-anchor="middle" fill="#FF8A65" font-size="12">HTML</text><rect x="96.8" y="160" width="49" height="28" rx="14" fill="#0A100F" stroke="#FF8A65" stroke-opacity=".6"/><text class="m" x="121" y="179" text-anchor="middle" fill="#FF8A65" font-size="12">CSS</text><text class="m" x="560" y="40" text-anchor="end" fill="#7C918B" font-size="12">↗</text></svg>