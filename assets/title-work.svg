<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" role="img" aria-label="03 projects — Things I've built so far."><title>03 projects — Things I've built so far.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{r:5;opacity:.9}50%{r:8;opacity:.35}}
@keyframes dash{to{stroke-dashoffset:-60}}@keyframes float{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><defs><linearGradient id="ln" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".7" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></linearGradient></defs>
<text class="m in" x="8" y="42" fill="#FF8A65" font-size="14" letter-spacing="4" style="animation-delay:0.15s">// 03 · PROJECTS</text>
<text class="s in" x="6" y="88" fill="#E8F1EE" font-size="38" font-weight="800" letter-spacing="-1" style="animation-delay:0.27s">Things I've built so far.</text>
