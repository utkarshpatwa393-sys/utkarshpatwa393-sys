<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-label="Building things, one commit at a time."><title>Building things, one commit at a time.</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{animation:in .8s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:.85;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{r:5;opacity:.9}50%{r:8;opacity:.35}}
@keyframes dash{to{stroke-dashoffset:-60}}@keyframes float{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><defs><linearGradient id="fg" x1="0" x2="1"><stop stop-color="#5EEAD4" stop-opacity=".0"/><stop offset=".5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="148" rx="18" fill="#0A100F" stroke="#1E2D29"/><rect x="60" y="24" width="1080" height="2" fill="url(#fg)"/>
<text class="s" x="600" y="78" text-anchor="middle" fill="#E8F1EE" font-size="26" font-weight="700">Still learning. Always shipping.</text>
<text class="m" x="600" y="110" text-anchor="middle" fill="#7C918B" font-size="13" letter-spacing="2">while (alive) { learn(); build(); repeat(); }</text>
<rect x="60" y="126" width="1080" height="2" fill="url(#fg)"/></svg>