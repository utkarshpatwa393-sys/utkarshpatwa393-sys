<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Competitive programming profiles on LeetCode, Codeforces and CodeChef"><title>Competitive programming profiles on LeetCode, Codeforces and CodeChef</title><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.in{animation:in .8s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:.85;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{r:5;opacity:.9}50%{r:8;opacity:.35}}
@keyframes dash{to{stroke-dashoffset:-60}}@keyframes float{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><g class="in" style="animation-delay:0.10s"><rect x="10" y="4" width="380" height="190" rx="18" fill="#111A18" stroke="#5EEAD4" stroke-opacity=".55"/><circle cx="76" cy="100" r="42" fill="#0A100F" stroke="#5EEAD4" stroke-width="2"/><text class="m" x="76" y="110" text-anchor="middle" fill="#5EEAD4" font-size="26" font-weight="700">{ }</text><text class="m" x="136" y="80" fill="#5EEAD4" font-size="13" letter-spacing="3">LEETCODE</text><text class="s" x="136" y="112" fill="#E8F1EE" font-size="19" font-weight="700">Utkarsh_Patwa2025</text><text class="m" x="136" y="142" fill="#7C918B" font-size="12">solving · learning · repeat</text></g><g class="in" style="animation-delay:0.30s"><rect x="410" y="4" width="380" height="190" rx="18" fill="#111A18" stroke="#FF8A65" stroke-opacity=".55"/><circle cx="476" cy="100" r="42" fill="#0A100F" stroke="#FF8A65" stroke-width="2"/><text class="m" x="476" y="110" text-anchor="middle" fill="#FF8A65" font-size="26" font-weight="700">&lt;/&gt;</text><text class="m" x="536" y="80" fill="#FF8A65" font-size="13" letter-spacing="3">CODEFORCES</text><text class="s" x="536" y="112" fill="#E8F1EE" font-size="19" font-weight="700">UTKARSHPATWA2026</text><text class="m" x="536" y="142" fill="#7C918B" font-size="12">solving · learning · repeat</text></g><g class="in" style="animation-delay:0.50s"><rect x="810" y="4" width="380" height="190" rx="18" fill="#111A18" stroke="#7DD3FC" stroke-opacity=".55"/><circle cx="876" cy="100" r="42" fill="#0A100F" stroke="#7DD3FC" stroke-width="2"/><text class="m" x="876" y="110" text-anchor="middle" fill="#7DD3FC" font-size="26" font-weight="700">#</text><text class="m" x="936" y="80" fill="#7DD3FC" font-size="13" letter-spacing="3">CODECHEF</text><text class="s" x="936" y="112" fill="#E8F1EE" font-size="19" font-weight="700">utkarsh_patwa</text><text class="m" x="936" y="142" fill="#7C918B" font-size="12">solving · learning · repeat</text></g></svg>